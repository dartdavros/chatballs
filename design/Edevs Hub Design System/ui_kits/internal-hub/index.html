<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Edevs Hub — Internal UI</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;height:100vh;overflow-x:auto;">
<div id="root" style="height:100%;"></div>
<script type="text/babel" src="./HubShell.jsx"></script>
<script type="text/babel" src="./CommandCenterPage.jsx"></script>
<script type="text/babel" src="./ClientsPage.jsx"></script>
<script type="text/babel" src="./AuthLoginPage.jsx"></script>
<script type="text/babel">
function App() {
  const [authed, setAuthed] = React.useState(false);
  const [page, setPage] = React.useState("command");
  if (!authed) return <AuthLoginPage onSuccess={() => setAuthed(true)} />;
  return (
    <HubShell page={page} onNavigate={setPage} crumb={page === "command" ? "Командный центр" : "Продажи · Клиенты"}>
      {page === "command"
        ? <CommandCenterPage onOpenDepartment={() => setPage("employees")} />
        : <ClientsPage />}
    </HubShell>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
