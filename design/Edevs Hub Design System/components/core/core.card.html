<!-- @dsCard group="Components" viewport="700x560" name="Core Primitives" subtitle="Button, IconButton, Input, Checkbox, Tag, Avatar, Icon" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body style="margin:0;background:var(--surface-page);font-family:var(--font-sans);">
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton, Input, Checkbox, Tag, Avatar, Icon } = window.EdevsHubDesignSystem_e4c9df;

function Row({ label, children }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 14, padding: "10px 0", borderBottom: "1px solid var(--n-8)" }}>
      <div style={{ width: 92, flex: "none", fontSize: 11, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: "0.04em" }}>{label}</div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>{children}</div>
    </div>
  );
}

function App() {
  const [pwd, setPwd] = React.useState(false);
  const [agree, setAgree] = React.useState(true);
  return (
    <div style={{ padding: 16, background: "#fff", border: "1px solid var(--n-8)", borderRadius: "var(--radius-2xl)", boxShadow: "var(--shadow-sm)" }}>
      <Row label="Button">
        <Button variant="primary">Сохранить</Button>
        <Button variant="secondary">Отмена</Button>
        <Button variant="ghost">Ghost</Button>
        <Button variant="danger">Удалить</Button>
        <Button variant="primary" disabled>Disabled</Button>
        <Button variant="primary" size="sm">Small</Button>
      </Row>
      <Row label="IconButton">
        <IconButton label="Уведомления" badge={4}><Icon name="bell" size={18} /></IconButton>
        <IconButton bare label="Ещё"><Icon name="moreVertical" size={17} /></IconButton>
      </Row>
      <Row label="Input">
        <div style={{ width: 220 }}>
          <Input placeholder="Поиск…" icon={<Icon name="search" size={15} color="#bfbfbf" />} />
        </div>
        <div style={{ width: 220 }}>
          <Input label="Email" required error hint="Неверный email" value="you@edevs.tech" />
        </div>
      </Row>
      <Row label="Checkbox">
        <Checkbox checked={agree} onChange={() => setAgree(!agree)} label="Принимаю условия" />
        <Checkbox checked={false} label="Не выбрано" />
      </Row>
      <Row label="Tag">
        <Tag tone="primary">FirePage</Tag>
        <Tag tone="ai">Foxray</Tag>
        <Tag pill tone="success" dot>Нормально</Tag>
        <Tag pill tone="warning" dot>Внимание</Tag>
        <Tag pill tone="error" dot>Критично</Tag>
      </Row>
      <Row label="Avatar">
        <Avatar initials="ИП" color="#1677ff" />
        <Avatar initials="АК" color="#9254de" size={40} />
      </Row>
      <Row label="Icon">
        {["dashboard","departments","employees","products","ai","integrations","settings","refresh","shield"].map(n => (
          <Icon key={n} name={n} color="#595959" />
        ))}
      </Row>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
