<!-- @dsCard group="Colors" viewport="700x160" name="Semantic" subtitle="success / warning / error / info" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-sans);background:#fff;padding:16px;">
<div style="display:flex;gap:10px;">
  <div style="flex:1;padding:12px;border-radius:9px;background:var(--success-bg);border:1px solid var(--success-border);"><div style="font-size:12.5px;font-weight:600;color:var(--success-text);">Success</div><div style="font-size:11px;color:#8c8c8c;margin-top:3px;">#389e0d</div></div>
  <div style="flex:1;padding:12px;border-radius:9px;background:var(--warning-bg);border:1px solid var(--warning-border);"><div style="font-size:12.5px;font-weight:600;color:var(--warning-text);">Warning</div><div style="font-size:11px;color:#8c8c8c;margin-top:3px;">#d48806</div></div>
  <div style="flex:1;padding:12px;border-radius:9px;background:var(--error-bg);border:1px solid var(--error-border);"><div style="font-size:12.5px;font-weight:600;color:var(--error-text);">Error</div><div style="font-size:11px;color:#8c8c8c;margin-top:3px;">#cf1322</div></div>
  <div style="flex:1;padding:12px;border-radius:9px;background:var(--primary-bg);border:1px solid var(--primary-border);"><div style="font-size:12.5px;font-weight:600;color:var(--primary-hover);">Info</div><div style="font-size:11px;color:#8c8c8c;margin-top:3px;">#1677ff</div></div>
</div>
</body></html>
