<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="Compact-enterprise density — exact px, not a 4/8 grid" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-sans);background:#fff;padding:16px;">
  <div style="display:flex;align-items:flex-end;gap:8px;">
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:16px;height:var(--space-4);background:var(--primary);"></div><span style="font-size:10px;color:#8c8c8c;">8</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:16px;height:var(--space-6);background:var(--primary);"></div><span style="font-size:10px;color:#8c8c8c;">10</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:16px;height:var(--space-8);background:var(--primary);"></div><span style="font-size:10px;color:#8c8c8c;">12</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:16px;height:var(--space-10);background:var(--primary);"></div><span style="font-size:10px;color:#8c8c8c;">16</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:16px;height:var(--space-12);background:var(--primary);"></div><span style="font-size:10px;color:#8c8c8c;">20</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:16px;height:var(--space-14);background:var(--primary);"></div><span style="font-size:10px;color:#8c8c8c;">24</span></div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:16px;height:var(--space-16);background:var(--primary);"></div><span style="font-size:10px;color:#8c8c8c;">32</span></div>
  </div>
  <div style="margin-top:12px;font-size:11.5px;color:#8c8c8c;">Control heights: sm 30 · md 34 · default 36 · lg 42 · xl 44 · 2xl 48 · topbar 56</div>
</body></html>
