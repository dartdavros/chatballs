<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-sans);background:#fff;padding:16px;">
  <div style="font-size:11px;font-weight:600;letter-spacing:0.05em;color:#bfbfbf;margin-bottom:8px;">ДИАЛОГИ — СЕЙЧАС</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--n-8);border:1px solid var(--n-8);border-radius:9px;overflow:hidden;">
    <div style="background:#fff;padding:13px 15px;"><div style="font-size:12px;color:#8c8c8c;margin-bottom:7px;">Открытые диалоги</div><div style="font-size:23px;font-weight:700;color:#262626;">42</div></div>
    <div style="background:#fff;padding:13px 15px;"><div style="font-size:12px;color:#8c8c8c;margin-bottom:7px;">Активны за 15 мин</div><div style="font-size:23px;font-weight:700;color:#262626;">9</div></div>
    <div style="background:#fff;padding:13px 15px;"><div style="font-size:12px;color:#8c8c8c;margin-bottom:7px;">На AI</div><div style="font-size:23px;font-weight:700;color:#262626;">35</div></div>
    <div style="background:#fff;padding:13px 15px;"><div style="font-size:12px;color:#8c8c8c;margin-bottom:7px;">Ожидают</div><div style="font-size:23px;font-weight:700;color:#262626;">0</div></div>
  </div>
</body></html>
