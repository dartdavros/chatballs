<!-- @dsCard group="Brand" viewport="700x180" name="Radii & Shadows" subtitle="Soft, low-opacity shadows only — no glassmorphism" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-sans);background:var(--n-11);padding:16px;">
  <div style="display:flex;gap:14px;">
    <div style="width:100px;height:70px;background:#fff;border-radius:var(--radius-sm);box-shadow:var(--shadow-xs);"></div>
    <div style="width:100px;height:70px;background:#fff;border-radius:var(--radius-2xl);box-shadow:var(--shadow-sm);"></div>
    <div style="width:100px;height:70px;background:#fff;border-radius:var(--radius-4xl);box-shadow:var(--shadow-md);"></div>
    <div style="width:100px;height:70px;background:#fff;border-radius:var(--radius-pill);box-shadow:var(--shadow-lg);"></div>
  </div>
  <div style="margin-top:10px;font-size:11px;color:#8c8c8c;">radius: 7 (control) · 12 (card) · 14 (modal) · pill (chip) — shadow: xs (hairline) · sm (card) · md (modal) · lg (dropdown)</div>
</body></html>
