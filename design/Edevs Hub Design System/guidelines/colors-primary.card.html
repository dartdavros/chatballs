<!-- @dsCard group="Colors" viewport="700x160" name="Primary" subtitle="Single accent — blue-6/blue-7, per ADR-HUB-0013" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-sans);background:#fff;padding:16px;">
<div style="display:flex;gap:10px;">
  <div style="flex:1;">
    <div style="height:64px;border-radius:8px;background:var(--primary);"></div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">--primary #1677ff</div>
  </div>
  <div style="flex:1;">
    <div style="height:64px;border-radius:8px;background:var(--primary-hover);"></div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">--primary-hover #0958d9</div>
  </div>
  <div style="flex:1;">
    <div style="height:64px;border-radius:8px;background:var(--primary-bg);border:1px solid var(--primary-border);"></div>
    <div style="font-size:12px;color:var(--text-secondary);margin-top:6px;">--primary-bg #e6f4ff</div>
  </div>
</div>
</body></html>
