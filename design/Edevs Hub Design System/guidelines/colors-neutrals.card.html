<!-- @dsCard group="Colors" viewport="700x200" name="Neutrals" subtitle="Text/border/surface neutral scale" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;font-family:var(--font-sans);background:#fff;padding:16px;">
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;">
  <div><div style="height:44px;border-radius:6px;background:var(--n-1);"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-1 heading</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-2);"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-2 body</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-3);"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-3 secondary</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-4);"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-4 tertiary</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-5);"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-5 disabled</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-6);"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-6 border</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-7);border:1px solid #eee;"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-7 input</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-8);border:1px solid #eee;"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-8 hairline</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-9);border:1px solid #eee;"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-9 hover</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-10);border:1px solid #eee;"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-10 table hd</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-11);border:1px solid #eee;"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">n-11 page bg</div></div>
  <div><div style="height:44px;border-radius:6px;background:var(--n-white);border:1px solid #eee;"></div><div style="font-size:10.5px;color:#8c8c8c;margin-top:4px;">white surface</div></div>
</div>
</body></html>
