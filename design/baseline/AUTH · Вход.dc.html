<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#262626;-webkit-font-smoothing:antialiased;padding:24px;">
  <div style="width:400px;max-width:100%;">

    <!-- brand -->
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px;">
      <div style="width:48px;height:48px;border-radius:13px;background:#1677ff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 12px rgba(22,119,255,0.3);"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 6 4-14 2 8h6"/></svg></div>
      <h1 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;color:#1f1f1f;">Edevs Hub</h1>
      <p style="margin:5px 0 0;font-size:13px;color:#8c8c8c;">Вход во внутренний кабинет</p>
    </div>

    <!-- form card -->
    <div style="background:#fff;border:1px solid #f0f0f0;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.05);padding:26px 26px 24px;">

      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:flex-start;gap:10px;padding:11px 13px;background:#fff2f0;border:1px solid #ffccc7;border-radius:9px;margin-bottom:18px;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#cf1322" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span style="font-size:12.5px;color:#cf1322;line-height:1.45;">Неверный email или пароль. Проверьте данные и попробуйте снова.</span>
        </div>
      </sc-if>

      <label style="display:block;font-size:12.5px;color:#595959;margin-bottom:7px;font-weight:500;">Email</label>
      <div style="display:flex;align-items:center;gap:9px;height:42px;padding:0 13px;border:1px solid {{ emailBorder }};border-radius:9px;background:#fff;margin-bottom:16px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#bfbfbf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg>
        <input value="{{ email }}" onInput="{{ onEmail }}" placeholder="you@edevs.tech" style="border:none;outline:none;background:transparent;font-size:14px;color:#262626;width:100%;font-family:inherit;" />
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;">
        <label style="font-size:12.5px;color:#595959;font-weight:500;">Пароль</label>
        <a href="#" style="font-size:12px;color:#1677ff;text-decoration:none;font-weight:500;" style-hover="text-decoration:underline;">Восстановить доступ</a>
      </div>
      <div style="display:flex;align-items:center;gap:9px;height:42px;padding:0 13px;border:1px solid {{ pwdBorder }};border-radius:9px;background:#fff;margin-bottom:22px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#bfbfbf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="{{ pwdType }}" value="{{ pwd }}" onInput="{{ onPwd }}" placeholder="Пароль" style="border:none;outline:none;background:transparent;font-size:14px;color:#262626;width:100%;font-family:inherit;" />
        <button onClick="{{ onTogglePwd }}" style="border:none;background:transparent;cursor:pointer;color:#bfbfbf;display:flex;flex:none;padding:0;" style-hover="color:#595959;">{{ eyeIcon }}</button>
      </div>

      <button onClick="{{ onSubmit }}" style="width:100%;height:44px;border-radius:9px;border:none;background:#1677ff;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(22,119,255,0.3);display:flex;align-items:center;justify-content:center;gap:8px;" style-hover="background:#0958d9;">Войти<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
    </div>

    <p style="text-align:center;margin:18px 0 0;font-size:12px;color:#bfbfbf;">Доступ только для сотрудников Edevs · защищённое соединение</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 }
}">
class Component extends DCLogic {
  state = { email: '', pwd: '', show: false, error: false };

  renderVals() {
    const eye = (open) => open
      ? React.createElement('svg', { viewBox: '0 0 24 24', width: 16, height: 16, fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { key: 1, d: 'M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z' }), React.createElement('circle', { key: 2, cx: 12, cy: 12, r: 3 }))
      : React.createElement('svg', { viewBox: '0 0 24 24', width: 16, height: 16, fill: 'none', stroke: 'currentColor', strokeWidth: 1.8, strokeLinecap: 'round', strokeLinejoin: 'round' }, React.createElement('path', { key: 1, d: 'M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 10 8 10 8a13 13 0 0 1-1.7 2.7M6.6 6.6A13 13 0 0 0 2 12s3 8 10 8a9 9 0 0 0 3.4-.6' }), React.createElement('path', { key: 2, d: 'M9.9 9.9a3 3 0 0 0 4.2 4.2' }), React.createElement('line', { key: 3, x1: 2, y1: 2, x2: 22, y2: 22 }));

    const err = this.state.error;
    return {
      email: this.state.email, pwd: this.state.pwd,
      pwdType: this.state.show ? 'text' : 'password',
      eyeIcon: eye(this.state.show),
      hasError: err,
      emailBorder: err ? '#ffccc7' : '#e8e8e8',
      pwdBorder: err ? '#ffccc7' : '#e8e8e8',
      onEmail: (e) => this.setState({ email: e.target.value, error: false }),
      onPwd: (e) => this.setState({ pwd: e.target.value, error: false }),
      onTogglePwd: () => this.setState((s) => ({ show: !s.show })),
      onSubmit: () => this.setState({ error: true }),
    };
  }
}
</script>
</body>
</html>
