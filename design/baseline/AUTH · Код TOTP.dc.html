<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#262626;-webkit-font-smoothing:antialiased;padding:24px;">
  <div style="width:400px;max-width:100%;">

    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px;">
      <div style="width:48px;height:48px;border-radius:13px;background:#1677ff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 12px rgba(22,119,255,0.3);"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5Z"/><path d="M9 12l2 2 4-4"/></svg></div>
      <h1 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;color:#1f1f1f;">Подтверждение входа</h1>
      <p style="margin:5px 0 0;font-size:13px;color:#8c8c8c;text-align:center;max-width:330px;line-height:1.45;">Введите 6-значный код из приложения-аутентификатора для <b style="color:#595959;">ivan@edevs.tech</b></p>
    </div>

    <div style="background:#fff;border:1px solid #f0f0f0;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.05);padding:28px 26px 24px;">

      <!-- 6 code cells (cells themselves are the input via transparent overlay) -->
      <div style="position:relative;margin-bottom:18px;">
        <div style="display:flex;gap:9px;justify-content:center;">
          <sc-for list="{{ cells }}" as="c" hint-placeholder-count="6">
            <div style="width:48px;height:56px;border:1.5px solid {{ c.border }};border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#1f1f1f;background:{{ c.bg }};font-family:'SF Mono',ui-monospace,Menlo,monospace;">{{ c.val }}</div>
          </sc-for>
        </div>
        <input value="{{ code }}" onInput="{{ onInput }}" inputmode="numeric" maxlength="6" autofocus style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:text;border:none;font-size:16px;" />
      </div>

      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:9px;padding:10px 13px;background:#fff2f0;border:1px solid #ffccc7;border-radius:9px;margin-bottom:16px;">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#cf1322" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span style="font-size:12.5px;color:#cf1322;">Неверный код. Осталось попыток: 2</span>
        </div>
      </sc-if>

      <!-- numpad-style helper input -->
      <button onClick="{{ onSubmit }}" style="{{ submitStyle }}">Подтвердить</button>

      <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;font-size:12.5px;color:#8c8c8c;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#bfbfbf" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Код обновится через <span style="color:#595959;font-weight:600;font-variant-numeric:tabular-nums;">{{ countdown }}</span>
      </div>
    </div>

    <p style="text-align:center;margin:18px 0 0;font-size:12px;color:#bfbfbf;">Нет доступа к коду? <a href="#" style="color:#1677ff;text-decoration:none;font-weight:500;" style-hover="text-decoration:underline;">Связаться с поддержкой</a></p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 }
}">
class Component extends DCLogic {
  state = { code: '', error: false };

  componentDidMount() {
    this._t = 24;
    this._iv = setInterval(() => {
      this._t = this._t <= 1 ? 30 : this._t - 1;
      this.forceUpdate();
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this._iv); }

  renderVals() {
    const code = this.state.code.replace(/\D/g, '').slice(0, 6);
    const err = this.state.error;
    const cells = Array.from({ length: 6 }).map((_, i) => {
      const val = code[i] || '';
      const active = i === code.length;
      return {
        val: val || '',
        border: err ? '#ffccc7' : active ? '#1677ff' : val ? '#bfbfbf' : '#e8e8e8',
        bg: val ? '#fafbff' : '#fff',
      };
    });
    const valid = code.length === 6;
    const submitStyle = valid
      ? 'width:100%;height:44px;border-radius:9px;border:none;background:#1677ff;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(22,119,255,0.3);'
      : 'width:100%;height:44px;border-radius:9px;border:none;background:#f0f0f0;color:#bfbfbf;font-size:14.5px;font-weight:600;cursor:not-allowed;';
    const t = this._t == null ? 24 : this._t;
    const countdown = '0:' + String(t).padStart(2, '0');

    return {
      cells, code, hasError: err, submitStyle, countdown,
      onInput: (e) => this.setState({ code: e.target.value.replace(/\D/g, '').slice(0, 6), error: false }),
      onSubmit: () => { if (code.length === 6) this.setState({ error: true }); },
    };
  }
}
</script>
</body>
</html>
