<div id="chatballs-sidebar-preview" lang="ru" aria-label="Предлагаемое левое меню Chatballs">
  <style>
    #chatballs-sidebar-preview{--cb-text:light-dark(#262626,#c3c5ca);--cb-heading:light-dark(#1f1f1f,#d6d7db);--cb-secondary:light-dark(#595959,#9a9ca3);--cb-muted:light-dark(#8c8c8c,#767881);--cb-border:light-dark(#f0f0f0,#2d2f35);--cb-input:light-dark(#e8e8e8,#37393f);--cb-card:light-dark(#fff,#1b1c1f);--cb-sidebar:light-dark(#fafafa,#181a1d);--cb-hover:light-dark(#f0f0f0,#2d2f35);--cb-subtle:light-dark(#f5f5f5,#27292e);--cb-accent:#0f9b8e;--cb-selected-bg:light-dark(color-mix(in srgb,#0f9b8e 10%,#fff),color-mix(in srgb,#0f9b8e 16%,#1b1c1f));--cb-selected-text:light-dark(color-mix(in srgb,#0f9b8e 82%,#000),color-mix(in srgb,#0f9b8e 62%,#fff));--cb-success:light-dark(#237a3f,#5fbf7a);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--cb-text);background:transparent;-webkit-font-smoothing:antialiased;width:100%;}
    #chatballs-sidebar-preview *{box-sizing:border-box;}
    #chatballs-sidebar-preview button,#chatballs-sidebar-preview select{font:inherit;}
    #chatballs-sidebar-preview button:focus-visible,#chatballs-sidebar-preview select:focus-visible{outline:2px solid var(--cb-accent);outline-offset:2px;}
    #chatballs-sidebar-preview .cb-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 16px;padding:0 98px 0 0;min-height:36px;}
    #chatballs-sidebar-preview .cb-toolbar label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--cb-secondary);}
    #chatballs-sidebar-preview .cb-toolbar select{height:32px;border:1px solid var(--cb-input);border-radius:7px;background:var(--cb-card);color:var(--cb-text);padding:0 24px 0 9px;font-size:12px;}
    #chatballs-sidebar-preview .cb-stage{display:flex;align-items:flex-start;justify-content:center;gap:36px;padding:24px 16px 28px;background-color:transparent;}
    #chatballs-sidebar-preview .cb-sidebar{width:220px;flex:none;display:flex;flex-direction:column;position:relative;background:var(--cb-sidebar);color:var(--cb-text);border:1px solid var(--cb-border);border-radius:10px;overflow:hidden;}
    #chatballs-sidebar-preview .cb-sidebar[data-height="768"]{height:768px;}
    #chatballs-sidebar-preview .cb-sidebar[data-height="640"]{height:640px;}
    #chatballs-sidebar-preview .cb-brand{height:56px;display:flex;align-items:center;flex:none;gap:10px;padding:14px 14px 10px;}
    #chatballs-sidebar-preview .cb-logo{display:block;width:28px;height:auto;flex:none;}
    #chatballs-sidebar-preview .cb-brand-name{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 6px 0 8px;min-width:0;flex:1;height:32px;font-size:14px;font-weight:700;color:var(--cb-heading);}
    #chatballs-sidebar-preview .cb-brand-name .cb-asset{color:var(--cb-muted);width:14px;height:14px;}
    #chatballs-sidebar-preview .cb-nav{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overscroll-behavior:contain;padding:4px 10px 8px;scrollbar-width:thin;scrollbar-color:var(--cb-input) transparent;}
    #chatballs-sidebar-preview .cb-group{display:flex;flex-direction:column;gap:2px;flex:none;}
    #chatballs-sidebar-preview .cb-item{display:flex;align-items:center;flex:none;gap:10px;width:100%;height:36px;min-height:36px;padding:0 10px;text-align:left;white-space:nowrap;color:var(--cb-text);background:transparent;border:0;border-radius:8px;font-size:13.5px;font-weight:500;}
    #chatballs-sidebar-preview .cb-item:hover:not(.is-active){color:var(--cb-heading);background:var(--cb-hover);}
    #chatballs-sidebar-preview .cb-item.is-active{color:var(--cb-selected-text);background:var(--cb-selected-bg);font-weight:600;}
    #chatballs-sidebar-preview .cb-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
    #chatballs-sidebar-preview .cb-icon{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;flex:none;color:inherit;}
    #chatballs-sidebar-preview .cb-icon svg{width:17px!important;height:17px!important;stroke-width:1.9;}
    #chatballs-sidebar-preview .cb-asset{display:inline-block;width:17px;height:17px;flex:none;background:currentColor;mask-image:var(--cb-mask);mask-size:contain;mask-repeat:no-repeat;mask-position:center;-webkit-mask-image:var(--cb-mask);-webkit-mask-size:contain;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;}
    #chatballs-sidebar-preview .cb-divider{height:1px;min-height:1px;flex:none;margin:6px;background:var(--cb-border);}
    #chatballs-sidebar-preview .cb-footer{flex:none;padding:6px 10px 0;border-top:1px solid var(--cb-border);background:var(--cb-sidebar);}
    #chatballs-sidebar-preview .cb-footer .cb-external{width:13px;height:13px;color:var(--cb-muted);}
    #chatballs-sidebar-preview .cb-profile{display:flex;align-items:center;gap:10px;height:68px;padding:10px 4px;color:var(--cb-secondary);}
    #chatballs-sidebar-preview .cb-avatar{display:flex;align-items:center;justify-content:center;position:relative;width:32px;height:32px;flex:none;border-radius:50%;background:var(--cb-selected-bg);color:var(--cb-selected-text);font-size:13px;font-weight:600;}
    #chatballs-sidebar-preview .cb-presence{position:absolute;right:0;bottom:0;width:9px;height:9px;background:var(--cb-success);border:2px solid var(--cb-sidebar);border-radius:50%;}
    #chatballs-sidebar-preview .cb-profile-info{flex:1;min-width:0;}
    #chatballs-sidebar-preview .cb-profile-info strong{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--cb-heading);font-size:13px;line-height:1.3;font-weight:600;}
    #chatballs-sidebar-preview .cb-status{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--cb-secondary);margin-top:2px;}
    #chatballs-sidebar-preview .cb-status .cb-asset{width:10px;height:10px;}
    #chatballs-sidebar-preview .cb-profile-more{color:var(--cb-muted);}
    #chatballs-sidebar-preview .cb-inspector{width:226px;min-width:0;padding-top:20px;flex:none;}
    #chatballs-sidebar-preview .cb-inspector-label{font-size:12px;color:var(--cb-secondary);margin:0 0 12px;font-weight:400;}
    #chatballs-sidebar-preview .cb-selected-name{font-size:19px;line-height:1.3;letter-spacing:-.2px;font-weight:600;color:var(--cb-heading);margin:0 0 6px;overflow-wrap:anywhere;}
    #chatballs-sidebar-preview .cb-selected-group{font-size:12px;color:var(--cb-secondary);margin:0;}
    #chatballs-sidebar-preview .cb-icon-detail{display:flex;align-items:center;gap:14px;margin-top:26px;min-height:40px;}
    #chatballs-sidebar-preview .cb-icon-large{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex:none;color:var(--cb-heading);}
    #chatballs-sidebar-preview .cb-icon-large svg,#chatballs-sidebar-preview .cb-icon-large .cb-asset{width:32px!important;height:32px!important;stroke-width:1.9;}
    #chatballs-sidebar-preview .cb-icon-code{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12px;overflow-wrap:anywhere;color:var(--cb-heading);}
    #chatballs-sidebar-preview .cb-icon-source{display:block;font-size:12px;color:var(--cb-secondary);margin-top:3px;}
    #chatballs-sidebar-preview .cb-provenance{font-size:12px;color:var(--cb-secondary);margin-top:18px;}
    @media(max-width:570px){#chatballs-sidebar-preview .cb-stage{flex-direction:column;align-items:center;gap:20px;padding:18px 8px;}#chatballs-sidebar-preview .cb-inspector{width:220px;padding:0;order:-1;}#chatballs-sidebar-preview .cb-icon-detail{margin-top:14px;}#chatballs-sidebar-preview .cb-inspector-label{margin-bottom:7px;}#chatballs-sidebar-preview .cb-selected-name{font-size:17px;}#chatballs-sidebar-preview .cb-provenance{margin-top:10px;}#chatballs-sidebar-preview .cb-toolbar{gap:8px;padding-right:88px;}#chatballs-sidebar-preview .cb-toolbar label{width:100%;justify-content:space-between;max-width:240px;}}
    @media(pointer:coarse){#chatballs-sidebar-preview .cb-item{height:44px;min-height:44px;}#chatballs-sidebar-preview .cb-toolbar select{min-height:44px;}}
  </style>

  <script>
    (()=>{
      const root=document.getElementById('chatballs-sidebar-preview');
      const assets=JSON.parse(root.querySelector('#cb-existing-assets').textContent);
      const pages={
        chat:{name:'Чат',group:'Работа',asset:'message',icon:'message'},
        contacts:{name:'Контакты',group:'Работа',asset:'user',icon:'user'},
        statistics:{name:'Статистика',group:'Работа',asset:'stats',icon:'stats'},
        agents:{name:'Агенты',group:'AI и автоматизация',asset:'robot',icon:'AgentIcon'},
        skills:{name:'Навыки',group:'AI и автоматизация',asset:'skill',icon:'SkillGlyph'},
        scenarios:{name:'Сценарии',group:'AI и автоматизация',lucide:'workflow',icon:'Workflow'},
        providers:{name:'AI-провайдеры',group:'AI и автоматизация',asset:'sparkles',icon:'sparkles'},
        mcp:{name:'MCP и HTTP',group:'AI и автоматизация',asset:'server',icon:'server'},
        knowledge:{name:'База знаний',group:'Знания',asset:'book',icon:'book'},
        portals:{name:'Порталы',group:'Знания',asset:'globe',icon:'globe'},
        widgets:{name:'Виджеты',group:'Каналы и сервисы',lucide:'message-circle',icon:'MessageCircle'},
        messengers:{name:'Мессенджеры',group:'Каналы и сервисы',lucide:'messages-square',icon:'MessagesSquare'},
        email:{name:'Почта',group:'Каналы и сервисы',asset:'mail',icon:'mail'},
        integrations:{name:'Интеграции',group:'Каналы и сервисы',asset:'plug',icon:'plug'},
        employees:{name:'Сотрудники',group:'Управление',asset:'team',icon:'team'},
        settings:{name:'Настройки',group:'Управление',asset:'settings',icon:'settings'},
        help:{name:'Помощь',group:'Служебная область',asset:'help',icon:'help'}
      };
      const setAsset=(node,key)=>node.style.setProperty('--cb-mask','url("'+assets[key]+'")');
      root.querySelectorAll('[data-asset]').forEach(node=>setAsset(node,node.dataset.asset));
      root.querySelector('[data-brand]').src=assets.logo;
      const buttons=Array.from(root.querySelectorAll('[data-page]'));
      const inspectorIcon=root.querySelector('#cb-selected-icon');
      function select(page){
        const current=pages[page];
        if(!current)return;
        buttons.forEach(button=>{
          const active=button.dataset.page===page;
          button.classList.toggle('is-active',active);
          if(active)button.setAttribute('aria-current','page');else button.removeAttribute('aria-current');
        });
        root.querySelector('#cb-selected-name').textContent=current.name;
        root.querySelector('#cb-selected-group').textContent=current.group;
        root.querySelector('#cb-selected-code').textContent=current.icon;
        root.querySelector('#cb-selected-source').textContent=current.lucide?'Lucide':'Chatballs';
        root.querySelector('#cb-provenance').textContent=current.lucide?'Новая иконка':'Иконка из текущего интерфейса';
        inspectorIcon.replaceChildren();
        if(current.asset){const node=document.createElement('span');node.className='cb-asset';node.setAttribute('aria-hidden','true');setAsset(node,current.asset);inspectorIcon.append(node);}
        else{
          const existing=root.querySelector('[data-page="'+page+'"] .cb-icon svg');
          if(existing)inspectorIcon.append(existing.cloneNode(true));
          else{const node=document.createElement('i');node.setAttribute('data-lucide',current.lucide);node.setAttribute('aria-hidden','true');inspectorIcon.append(node);if(window.lucide)window.lucide.createIcons({attrs:{width:17,height:17}});}
        }
      }
      buttons.forEach(button=>button.addEventListener('click',()=>select(button.dataset.page)));
      root.querySelector('#cb-theme').addEventListener('change',event=>{root.querySelector('.cb-sidebar').style.colorScheme=event.target.value==='auto'?'inherit':event.target.value;});
      root.querySelector('#cb-height').addEventListener('change',event=>{root.querySelector('.cb-sidebar').dataset.height=event.target.value;});
    })();
  </script>
