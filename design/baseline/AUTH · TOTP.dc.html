<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
@keyframes hubBlink{0%,100%{opacity:1;}50%{opacity:0;}}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#262626;-webkit-font-smoothing:antialiased;padding:24px;">
  <div style="width:440px;max-width:100%;">

    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:24px;">
      <div style="width:48px;height:48px;border-radius:13px;background:#1677ff;display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 4px 12px rgba(22,119,255,0.3);"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V5Z"/><path d="m9 12 2 2 4-4"/></svg></div>
      <h1 style="margin:0;font-size:20px;font-weight:700;letter-spacing:-0.01em;color:#1f1f1f;text-align:center;">Подключение двухфакторной аутентификации</h1>
      <p style="margin:5px 0 0;font-size:13px;color:#8c8c8c;text-align:center;line-height:1.5;max-width:340px;">Отсканируйте QR-код в приложении-аутентификаторе, затем подтвердите кодом</p>
    </div>

    <div style="background:#fff;border:1px solid #f0f0f0;border-radius:14px;box-shadow:0 2px 12px rgba(0,0,0,0.05);padding:26px;">

      <!-- STEP 1 -->
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:16px;">
        <div style="width:22px;height:22px;border-radius:50%;background:#1677ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;">1</div>
        <span style="font-size:13.5px;font-weight:600;color:#262626;">Отсканируйте QR-код</span>
      </div>

      <div style="display:flex;justify-content:center;margin-bottom:14px;">
        <div style="padding:14px;background:#fff;border:1px solid #f0f0f0;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,0.04);">
          <div style="display:grid;grid-template-columns:repeat(25,1fr);width:200px;height:200px;">
            <sc-for list="{{ qr }}" as="m" hint-placeholder-count="625">
              <div style="{{ m.style }}"></div>
            </sc-for>
          </div>
        </div>
      </div>

      <p style="margin:0 0 8px;font-size:12px;color:#8c8c8c;text-align:center;">Не получается отсканировать? Введите ключ вручную:</p>
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 13px;background:#f5f5f5;border-radius:9px;margin-bottom:22px;">
        <span style="font-size:13.5px;font-weight:600;letter-spacing:2px;color:#262626;font-family:'SF Mono',ui-monospace,Menlo,monospace;">{{ secret }}</span>
        <button onClick="{{ onCopy }}" style="display:flex;align-items:center;gap:5px;border:none;background:transparent;cursor:pointer;font-size:12px;font-weight:600;color:#1677ff;padding:2px;" title="Скопировать">
          <sc-if value="{{ copied }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#52c41a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></sc-if>
          <sc-if value="{{ notCopied }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#1677ff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></sc-if>
        </button>
      </div>

      <div style="height:1px;background:#f0f0f0;margin-bottom:20px;"></div>

      <!-- STEP 2 -->
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px;">
        <div style="width:22px;height:22px;border-radius:50%;background:#1677ff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;">2</div>
        <span style="font-size:13.5px;font-weight:600;color:#262626;">Введите код из приложения</span>
      </div>

      <div style="position:relative;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;gap:9px;">
          <sc-for list="{{ cells }}" as="c" hint-placeholder-count="6">
            <div style="{{ c.style }}">{{ c.char }}<sc-if value="{{ c.cursor }}" hint-placeholder-val="{{ false }}"><span style="display:inline-block;width:2px;height:24px;background:#1677ff;animation:hubBlink 1s step-end infinite;"></span></sc-if></div>
          </sc-for>
        </div>
        <input value="{{ code }}" onInput="{{ onInput }}" inputmode="numeric" maxlength="6" autofocus style="position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:text;border:none;font-size:16px;" />
      </div>

      <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#cf1322" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span style="font-size:12px;color:#cf1322;">Код не совпал. Попробуйте ещё раз</span></div>
      </sc-if>

      <button onClick="{{ onSubmit }}" style="{{ submitStyle }}">Активировать</button>
    </div>

    <div style="text-align:center;margin-top:18px;"><a href="#" style="font-size:12.5px;color:#8c8c8c;text-decoration:none;font-weight:500;" style-hover="text-decoration:underline;">Отмена</a></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: 1440, &quot;height&quot;: 900 }
}">
class Component extends DCLogic {
  state = { code: '', error: false, copied: false };

  renderVals() {
    // deterministic QR-like placeholder grid (25x25 modules)
    const N = 25;
    const isFinder = (r, c) => {
      const inBox = (br, bc) => r >= br && r < br + 7 && c >= bc && c < bc + 7;
      const ring = (br, bc) => {
        const dr = r - br, dc = c - bc;
        const edge = (r === br || r === br + 6 || c === bc || c === bc + 6);
        const core = (dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4);
        return inBox(br, bc) && (edge || core);
      };
      return ring(0, 0) || ring(0, N - 7) || ring(N - 7, 0);
    };
    const inFinderArea = (r, c) =>
      (r < 8 && c < 8) || (r < 8 && c >= N - 8) || (r >= N - 8 && c < 8);
    let seed = 7;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const qr = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        let on;
        if (isFinder(r, c)) on = true;
        else if (inFinderArea(r, c)) on = false;
        else on = rnd() > 0.5;
        qr.push({ style: 'width:100%;height:100%;background:' + (on ? '#1f1f1f' : 'transparent') + ';' });
      }
    }

    const code = this.state.code;
    const cells = Array.from({ length: 6 }).map((_, i) => {
      const char = code[i] || '';
      const filled = !!char;
      const active = i === code.length;
      const base = 'flex:1;height:56px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#1f1f1f;font-family:\'SF Mono\',ui-monospace,Menlo,monospace;';
      const style = this.state.error
        ? base + 'border:1.5px solid #ffccc7;background:#fff8f7;'
        : filled
          ? base + 'border:1.5px solid #1677ff;background:#f7fbff;'
          : active
            ? base + 'border:1.5px solid #1677ff;background:#fff;'
            : base + 'border:1.5px solid #e8e8e8;background:#fafafa;';
      return { char, cursor: active && char === '', style };
    });

    const complete = code.length === 6;
    const submitStyle = complete
      ? 'width:100%;height:44px;border-radius:9px;border:none;background:#1677ff;color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;box-shadow:0 1px 2px rgba(22,119,255,0.3);'
      : 'width:100%;height:44px;border-radius:9px;border:none;background:#f0f0f0;color:#bfbfbf;font-size:14.5px;font-weight:600;cursor:not-allowed;';

    return {
      code, qr, cells, secret: 'JBSW Y3DP EHPK 3PXP',
      hasError: this.state.error, submitStyle,
      copied: this.state.copied, notCopied: !this.state.copied,
      onInput: (e) => this.setState({ code: e.target.value.replace(/[^0-9]/g, '').slice(0, 6), error: false }),
      onSubmit: () => { if (complete) this.setState({ error: true }); },
      onCopy: () => {
        try { navigator.clipboard && navigator.clipboard.writeText('JBSWY3DPEHPK3PXP'); } catch (e) {}
        this.setState({ copied: true });
        clearTimeout(this._ct);
        this._ct = setTimeout(() => this.setState({ copied: false }), 1600);
      },
    };
  }
}
</script>
</body>
</html>
