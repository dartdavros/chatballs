<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сервисное сообщение · Chatballs</title>
  <script>
    const preview = new URLSearchParams(location.search);
    const theme = preview.get("theme");
    if (theme === "dark") {
      document.documentElement.dataset.theme = "dark";
      document.title = "Сервисное сообщение · Chatballs · Тёмная тема";
    } else {
      document.title = "Сервисное сообщение · Chatballs · Светлая тема";
    }
  </script>
  <link rel="stylesheet" href="../../../apps/internal-ui/src/styles/base.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/shared/ui-controls.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/shared/links.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/layout/styles.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/layout/sidebar-navigation.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/features/administration/styles.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/features/settings/styles.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/features/updates/external-checks.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .service-announcement {
      --close-size: 24px;
      display: grid;
      grid-template-columns: var(--close-size) minmax(0, 1fr) var(--close-size);
      align-items: start;
      color: var(--text-heading);
    }
    .service-announcement[hidden] { display: none; }
    .service-announcement-content {
      grid-column: 2;
      justify-self: center;
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      max-width: 100%;
      min-height: var(--close-size);
    }
    .service-announcement-content > svg { flex: none; color: var(--primary-text); }
    .service-announcement-text {
      min-width: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .service-announcement-content > .link {
      flex: none;
      white-space: nowrap;
    }
    .service-announcement-content > .link:hover {
      color: color-mix(in srgb, var(--primary-text) 88%, var(--text-heading));
    }
    .service-announcement-content > .link svg { flex: none; }
    .service-announcement-content > .link[hidden] { display: none; }
    .service-announcement .demo-install-close {
      grid-column: 3;
      width: var(--close-size);
      height: var(--close-size);
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      opacity: 1;
    }
    .service-announcement .demo-install-close:hover {
      background: var(--primary-border);
    }
    .service-announcement :is(.link, button):focus-visible { outline-color: currentColor; }
    .preview-shell.hub-shell { flex: 1; height: auto; }
    .preview-shell .hub-sidebar { height: auto; }
    .preview-shell .settings-content { min-width: 0; }
    .preview-shell .settings-head { margin: 0; }
    .preview-page-header {
      padding: 16px clamp(18px, 3vw, 40px);
      background: var(--surface-card);
      border-bottom: 1px solid var(--border-default);
    }
    @media (max-width: 768px) {
      .preview-shell .hub-sidebar { display: none; }
      .service-announcement { --close-size: 32px; padding: 5px 8px; gap: 6px; }
      .service-announcement-content { gap: 6px; }
    }
  </style>
</head>
<body>
  <section class="demo-install-banner service-announcement" aria-label="Сервисное сообщение">
    <div class="service-announcement-content">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>
      <span class="service-announcement-text"><strong>Плановое обслуживание.</strong><span> Вечером возможен короткий перерыв.</span></span>
      <a class="link is-neutral has-icon" href="https://chatballs.ru/" target="_blank" rel="noreferrer">Подробнее<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
    </div>
    <button class="demo-install-close" type="button" aria-label="Закрыть" title="Закрыть">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </section>

  <main class="hub-shell is-settings-route is-chat-route preview-shell">
    <aside class="hub-sidebar" aria-label="Навигация">
      <div class="hub-brand">
        <span class="hub-brand-mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="26" height="26" fill="currentColor"><defs><mask id="brand-mark"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="24.54" r="9" fill="#000"/><circle cx="50" cy="75.46" r="9" fill="#000"/></mask></defs><g mask="url(#brand-mark)"><circle cx="29" cy="50" r="24"/><circle cx="71" cy="50" r="24"/><rect x="44.2" y="31.4" width="11.6" height="37.2"/></g></svg>
        </span>
        <div class="hub-brand-switch"><span>Ателье Норд</span></div>
      </div>
      <nav class="hub-nav">
        <div class="hub-nav-item">Диалоги</div>
        <div class="hub-nav-item is-active" aria-current="page">Настройки</div>
      </nav>
    </aside>
    <div class="hub-main">
      <div class="preview-page-header">
        <header class="settings-head" tabindex="-1">
          <div><h2>Платформа</h2><p>Свойства самой установки</p></div>
        </header>
      </div>
      <section class="settings-content is-single">
        <div class="settings-content-inner">
          <section class="administration-card">
            <div class="settings-card-head"><div><strong>Обновления</strong><small>Версия установки и обновления с канала релизов</small></div></div>
            <section class="external-setting">
              <div class="settings-card-head">
                <div><strong>Получать обновления и сервисные сообщения.</strong><small>В запросах будет передаваться идентификатор установки</small></div>
                <button class="ui-switch on" type="button" role="switch" aria-checked="true" aria-label="Получать обновления и сервисные сообщения" disabled><i></i></button>
              </div>
            </section>
          </section>
        </div>
      </section>
    </div>
  </main>
  <script>
    const banner = document.querySelector(".service-announcement");
    if (preview.get("content") === "long") {
      banner.querySelector(".service-announcement-text > span").textContent =
        " Вечером возможен короткий перерыв. Если связь пропадёт, откройте Chatballs снова через несколько минут.\n\nВсе сообщения сохранятся. Работа сервисов возобновится автоматически.";
    }
    if (preview.get("link") === "none") banner.querySelector("a").hidden = true;
    banner.querySelector(".demo-install-close").addEventListener("click", () => {
      banner.hidden = true;
      document.querySelector(".settings-head").focus();
    });
  </script>
</body>
</html>
