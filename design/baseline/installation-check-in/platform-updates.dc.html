<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Обновления · Chatballs</title>
  <link rel="stylesheet" href="../../../apps/internal-ui/src/styles/base.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/shared/form-controls.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/shared/ui-controls.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/shared/links.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/features/administration/styles.css">
  <link rel="stylesheet" href="../../../apps/internal-ui/src/features/settings/styles.css">
  <link rel="stylesheet" href="../../../packages/ui/src/loader/loader.css">
  <style>
    .design-document { max-width: 1000px; margin: auto; padding: 28px 24px 48px; }
    .design-document > h1 { font-size: 22px; margin: 0 0 12px; }
    .design-document > p { max-width: 72ch; margin-inline: 0; }
    .design-frame { margin-top: 28px; }
    .design-frame > h2 { margin: 0 0 10px; font-size: 13.5px; }
    .design-frame .settings-content { border: 1px solid var(--border-default); border-radius: var(--radius-2xl); }
    .external-setting { margin-top: 18px; padding: 14px 0 10px; border-top: 1px solid var(--n-9); }
    .external-setting .settings-card-head { padding-bottom: 0; border-bottom: 0; }
    .external-setting-status { min-height: 22px; color: var(--primary); }
    .external-setting-status .settings-section-error { margin: 4px 0 0; }
    @media (max-width: 600px) {
      .design-document { padding-inline: 12px; }
      .settings-facts { grid-template-columns: minmax(0, 1fr) auto; }
    }
  </style>
</head>
<body>
  <main class="design-document">
    <h1>Обновления</h1>
    <div id="frames"></div>
  </main>

  <template id="frame">
    <section class="design-frame">
      <h2 data-frame-title></h2>
      <section class="settings-content is-single">
        <div class="settings-content-inner">
          <header class="settings-head">
            <div>
              <h2>Платформа</h2>
              <p>Свойства самой установки: адрес, по которому её открывают и по которому строятся ссылки на файлы, и почтовый сервер для приглашений и сброса пароля.</p>
            </div>
          </header>
          <section class="administration-card">
            <div class="settings-card-head">
              <div>
                <strong>Обновления</strong>
                <small>Версия установки и обновления с канала релизов</small>
              </div>
              <button type="button" class="secondary-button" data-check>Проверить</button>
            </div>
            <dl class="settings-facts">
              <div><dt>Текущая версия</dt><dd>1.22.0</dd></div>
              <div><dt>Последняя версия</dt><dd>1.22.0</dd></div>
              <div><dt>Проверка</dt><dd>21 нояб., 14:30</dd></div>
            </dl>
            <p class="settings-card-note">Установлена последняя версия</p>
            <section class="external-setting">
              <div class="settings-card-head">
                <div>
                  <strong>Получать обновления и сервисные сообщения.</strong>
                  <small>В запросах будет передаваться идентификатор установки</small>
                </div>
                <button
                  type="button" role="switch" class="ui-switch"
                  aria-label="Получать обновления и сервисные сообщения. В запросах будет передаваться идентификатор установки"
                ><i></i></button>
              </div>
              <div class="external-setting-status" aria-live="polite"></div>
            </section>
          </section>
        </div>
      </section>
    </section>
  </template>

  <template id="saving">
    <img class="cb-loader logo-spinner" src="./loader.svg" width="20" height="20" role="status" alt="Сохранение">
  </template>

  <script>
    const frames = [
      { id: "enabled", title: "Получение включено" },
      { id: "disabled", title: "Получение выключено", disabled: true },
      { id: "saving", title: "Изменение сохраняется", saving: true },
      { id: "save-error", title: "Ошибка сохранения", saveError: true },
    ];

    function appendText(container, text, error = false) {
      const element = document.createElement("p");
      element.className = error ? "settings-section-error" : "settings-card-note";
      if (error) element.setAttribute("role", "alert");
      element.textContent = text;
      container.append(element);
    }

    for (const state of frames) {
      const fragment = document.querySelector("#frame").content.cloneNode(true);
      const frame = fragment.querySelector(".design-frame");
      frame.dataset.state = state.id;
      frame.querySelector("[data-frame-title]").textContent = state.title;
      const toggle = frame.querySelector('[role="switch"]');
      toggle.classList.toggle("on", !state.disabled);
      toggle.setAttribute("aria-checked", String(!state.disabled));
      toggle.disabled = Boolean(state.saving);
      frame.querySelector("[data-check]").disabled = Boolean(state.disabled || state.saving);

      const feedback = frame.querySelector(".external-setting-status");
      if (state.saving) feedback.append(document.querySelector("#saving").content.cloneNode(true));
      if (state.saveError) appendText(feedback, "Не удалось сохранить настройку.", true);

      document.querySelector("#frames").append(fragment);
    }
  </script>
</body>
</html>
