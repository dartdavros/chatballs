articles:
  - slug: "trebovaniya-k-serveru"
    categoryPath:
      - "Установка и сервер"
    locale: "ru"
    title: "Требования к серверу"
    summary: "Минимальная конфигурация по количеству диалогов в день, расчёт канала для звонков и места для файлов."
    content: |
      Для небольшой установки начните с VPS с **1 vCPU, 2 ГБ оперативной памяти и 30 ГБ SSD**. Полный стек Chatballs работает на такой конфигурации. ИИ-модель подключается через внешний API и не размещается на этом сервере.

      ## Сервер по количеству диалогов

      Выбирайте конфигурацию по числу новых диалогов в день. Если на одной установке несколько организаций, сложите их диалоги.

      | Новые диалоги в день | Процессор | Оперативная память | SSD |
      |---|---|---|---|
      | До 50 | 1 vCPU | 2 ГБ | 30 ГБ |
      | До 300 | 1 vCPU | 2 ГБ | 30 ГБ |
      | До 1 000 | 2 vCPU | 4 ГБ | 40 ГБ |

      Это предварительные минимальные ориентиры для выбора сервера, а не подтверждённые нагрузочными испытаниями пределы производительности. Они рассчитаны на преимущественно текстовые диалоги примерно до 20 сообщений, небольшую базу знаний и обращения, распределённые в течение дня. На сервере не должно быть других тяжёлых приложений.

      Количество созданных ИИ-агентов не требует отдельного сервера для каждого агента. Для выбора конфигурации важнее поток сообщений и количество одновременно обрабатываемых обращений.

      Если большая часть клиентов пишет одновременно, например после рассылки, ответы ИИ могут ожидать своей очереди даже при небольшом суточном количестве диалогов. Скорость зависит также от ИИ-провайдера и настроек обработки обращений; увеличение мощности VPS само по себе не устраняет эти задержки.

      ## Что должно быть на сервере

      - Linux с архитектурой x86_64.
      - Docker и плагин Docker Compose.
      - Доступные снаружи порты 80 и 443.
      - Исходящий доступ к ИИ-провайдеру и подключённым каналам общения.

      Домен можно указать после установки. Для звонков в браузере настройте HTTPS. Порядок установки описан в статье [«Первый запуск»](/articles/pervyj-zapusk).

      ## Одновременные звонки

      Звонки учитывайте отдельно от числа диалогов в день. Один диалог может обойтись без звонка или включать длительный видеозвонок.

      При прямом соединении аудио и видео идут между участниками. Если прямое соединение невозможно, медиатрафик проходит через сервер Chatballs. При выборе канала сервера учитывайте случай, когда все звонки проходят через него.

      Для предварительного расчёта примем, что каждый участник отправляет **0,1 Мбит/с для аудио** или **2 Мбит/с для видео вместе с аудио**:

      | Одновременные звонки | Аудио: входящий / исходящий трафик сервера | Видео: входящий / исходящий трафик сервера |
      |---|---|---|
      | 1 | 0,2 / 0,2 Мбит/с | 4 / 4 Мбит/с |
      | 3 | 0,6 / 0,6 Мбит/с | 12 / 12 Мбит/с |
      | 10 | 2 / 2 Мбит/с | 40 / 40 Мбит/с |
      | 25 | 5 / 5 Мбит/с | 100 / 100 Мбит/с |

      Это расчёт сети при заданном качестве, а не обещание числа звонков для каждой конфигурации VPS. Фактический трафик зависит от качества видео, браузеров и сети участников. Добавьте к расчёту запас около 30% и оставьте пропускную способность для переписки, файлов и остальной работы приложения. Требуемая скорость должна быть доступна и на приём, и на передачу.

      Например, для десяти видеозвонков получается около 52 Мбит/с в каждом направлении с указанным запасом, без учёта других задач. При непрерывных звонках исходящий трафик без запаса составит примерно 18 ГБ за час: проверьте также месячный лимит трафика в тарифе VPS.

      Для звонков откройте порт 3478 по UDP и TCP и диапазон 49160–49999 по UDP. Один сотрудник может вести один звонок одновременно. Подключение и сетевые условия описаны в статье [«Звонки и relay»](/articles/zvonki-relay).

      ## Место для файлов и резервных копий

      SSD в основной таблице — стартовый объём для системы, приложения и небольшой базы данных. Вложения, голосовые сообщения, документы базы знаний и резервные копии требуют дополнительного места.

      Оцените место для вложений по формуле:

      **Диалоги в день × средний объём файлов в диалоге × срок хранения в днях.**

      Например, 50 диалогов в день с файлами в среднем по 1 МБ за 30 дней займут около 1,5 ГБ дополнительно. При той же нагрузке за год — около 18,3 ГБ. Это только вложения; переписка и база данных учитываются отдельно.

      Вложения можно хранить во [внешнем S3-хранилище](/articles/hranilishche-fajlov). Резервные копии лучше хранить отдельно от рабочего сервера: см. [«Резервное копирование и восстановление»](/articles/rezervnoe-kopirovanie). Текущая версия Chatballs не записывает аудио и видео звонков.

      ## Когда увеличивать ресурсы

      Начните с минимальной конфигурации для своего потока обращений и следите за потреблением ресурсов в часы наибольшей нагрузки. Увеличивайте память, если её регулярно не хватает, процессор — при длительной высокой загрузке, диск — по мере роста данных и файлов.

      Если сервер свободен, а ИИ отвечает медленно, проверьте скорость и ограничения провайдера и ожидание обработки сообщений. Более дорогой VPS в такой ситуации может не ускорить ответы.

      Таблица относится к Chatballs с внешним ИИ-провайдером. Для размещения самой ИИ-модели на этом же сервере требования рассчитываются отдельно под выбранную модель.
