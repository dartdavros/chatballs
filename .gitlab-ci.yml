# GitLab CI/CD — canonical pipeline Chatballs (ADR-HUB-0028 / PLAN-CHATBALLS-0002).
# Application orchestration is owned only by the release-bundled `chatballs` CLI.

stages:
  - validate
  - test
  - build
  - release
  - deploy

variables:
  APP_DIR: "."
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
  BACKEND_LATEST_IMAGE: "$CI_REGISTRY_IMAGE/backend:latest"
  FRONTEND_LATEST_IMAGE: "$CI_REGISTRY_IMAGE/frontend:latest"

  POSTGRES_IMAGE: "pgvector/pgvector:pg16"
  REDIS_IMAGE: "redis:7-alpine"
  GATEWAY_IMAGE: "caddy:2.8.4"
  COTURN_IMAGE: "coturn/coturn:4.6"

include:
  - local: "/.gitlab/ci/validate-test.yml"
  - local: "/.gitlab/ci/build-release.yml"
  - local: "/.gitlab/ci/deploy.yml"
