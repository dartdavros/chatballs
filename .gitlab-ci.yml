stages:
  - validate
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHA"
  FRONTEND_IMAGE: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHA"
  BACKEND_LATEST_IMAGE: "$CI_REGISTRY_IMAGE/backend:latest"
  FRONTEND_LATEST_IMAGE: "$CI_REGISTRY_IMAGE/frontend:latest"

backend:test:
  stage: test
  image: python:3.12-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    HUB_DEBUG: "true"
    HUB_SECRET_KEY: "ci-test-secret"
    HUB_FIELD_ENCRYPTION_KEY: ""
    POSTGRES_DB: "edevs_hub_test"
    POSTGRES_USER: "edevs_hub"
    POSTGRES_PASSWORD: "edevs_hub"
    POSTGRES_HOST: "postgres"
    POSTGRES_PORT: "5432"
    REDIS_URL: "redis://redis:6379/0"
  before_script:
    - cd apps/backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - python manage.py test
  rules:
    - if: '$CI_COMMIT_BRANCH'

frontend:build:
  stage: validate
  image: node:22-alpine
  before_script:
    - npm ci
  script:
    - npm run typecheck
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH'

images:build:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  needs:
    - backend:test
    - frontend:build
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - docker build -f apps/backend/Dockerfile.production -t "$BACKEND_IMAGE" -t "$BACKEND_LATEST_IMAGE" .
    - docker build -f deploy/docker/frontend.Dockerfile -t "$FRONTEND_IMAGE" -t "$FRONTEND_LATEST_IMAGE" .
    - docker push "$BACKEND_IMAGE"
    - docker push "$FRONTEND_IMAGE"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker push "$BACKEND_LATEST_IMAGE"
        docker push "$FRONTEND_LATEST_IMAGE"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH'

deploy:production:
  stage: deploy
  image: alpine:3.20
  needs:
    - images:build
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "sudo mkdir -p '$DEPLOY_PATH' && sudo chown '$DEPLOY_USER':'$DEPLOY_USER' '$DEPLOY_PATH'"
    - scp -P "${DEPLOY_PORT:-22}" compose.production.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.production.yaml"
    - |
      ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "printf '%s\n' \
        'HUB_BACKEND_IMAGE=$BACKEND_IMAGE' \
        'HUB_FRONTEND_IMAGE=$FRONTEND_IMAGE' \
        > '$DEPLOY_PATH/.env.release'"
    - |
      ssh -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && \
        echo '$CI_REGISTRY_PASSWORD' | sudo docker login '$CI_REGISTRY' -u '$CI_REGISTRY_USER' --password-stdin && \
        sudo docker compose --env-file .env.production --env-file .env.release -f compose.production.yaml pull && \
        sudo docker compose --env-file .env.production --env-file .env.release -f compose.production.yaml up -d && \
        sudo docker compose --env-file .env.production --env-file .env.release -f compose.production.yaml exec -T backend python manage.py migrate --noinput && \
        sudo docker compose --env-file .env.production --env-file .env.release -f compose.production.yaml exec -T backend python manage.py collectstatic --noinput && \
        sudo docker compose --env-file .env.production --env-file .env.release -f compose.production.yaml exec -T backend python manage.py seed_hub_initial_data"
  environment:
    name: production
    url: https://hub.edevs.tech
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
