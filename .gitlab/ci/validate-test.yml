lint:python:
  stage: validate
  image: python:3.12-slim
  before_script:
    # Версия ruff — из requirements бэкенда, чтобы CI и образ не разъезжались.
    - pip install --disable-pip-version-check "$(grep -E '^ruff' $APP_DIR/apps/backend/requirements.txt)"
  script:
    - ruff --version
    # Конфигурация в корневом pyproject.toml (src = apps/backend).
    - ruff check "$APP_DIR/apps/backend"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

frontend:build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd "$APP_DIR"
    - npm ci
  script:
    - npm run typecheck
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

gateway:validate:
  stage: validate
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - mkdir -p "$APP_DIR/.ci-instance/data/caddy" "$APP_DIR/.ci-instance/data/caddy-config"
  script:
    - |
      set -eu
      # Никакого .env: продукт поднимается со значениями по умолчанию, и
      # проверять его надо ровно так же, как он ставится у человека.
      export CHATBALLS_INSTANCE_DIR="$CI_PROJECT_DIR/$APP_DIR/.ci-instance"
      export CHATBALLS_RELEASE_DIR="$CI_PROJECT_DIR/$APP_DIR"

      docker compose \
        --project-directory "$CHATBALLS_INSTANCE_DIR" \
        -f "$APP_DIR/compose.yaml" \
        config -q

      # Caddyfile лежит внутри образа шлюза, и `caddy validate` выполняется
      # прямо в сборке (deploy/docker/gateway.Dockerfile). Поэтому проверка
      # конфигурации — это сборка образа, а не запуск сервиса.
      docker build \
        -f "$APP_DIR/deploy/docker/gateway.Dockerfile" \
        -t chatballs-gateway:validate \
        "$APP_DIR"
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

backend:test:
  stage: test
  image: python:3.12-slim
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  variables:
    CHATBALLS_DEBUG: "true"
    CHATBALLS_SECRET_KEY: "ci-test-secret"
    CHATBALLS_FIELD_ENCRYPTION_KEY: ""
    POSTGRES_DB: "chatballs_test"
    POSTGRES_USER: "chatballs"
    POSTGRES_PASSWORD: "chatballs"
    POSTGRES_HOST: "postgres"
    POSTGRES_PORT: "5432"
    REDIS_URL: "redis://redis:6379/0"
  before_script:
    - cd "$APP_DIR/apps/backend"
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python manage.py check
    - pytest
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

cli:test:
  stage: test
  image: python:3.12-slim
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash coreutils util-linux
    - rm -rf /var/lib/apt/lists/*
    - python -m pip install --no-cache-dir pytest
  script:
    - cd "$APP_DIR"
    - pytest -c tests/cli/pytest.ini tests/cli
  rules:
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
