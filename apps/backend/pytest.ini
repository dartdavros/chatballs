[pytest]
DJANGO_SETTINGS_MODULE = chatballs_backend.settings
python_files = tests.py test_*.py *_tests.py

# Область сбора. Без неё pytest без аргументов обходит весь каталог backend,
# включая примонтированный media/ с каталогом на каждую организацию: на живой
# установке это сотни тысяч файлов, и сбор падает раньше первого теста
# (OSError: Cannot allocate memory). Тесты живут только в двух пакетах.
testpaths = chatballs chatballs_backend

# Страховка на случай запуска с явным путём или из другого каталога:
# media и staticfiles — данные и артефакты сборки, тестов там нет.
norecursedirs = media staticfiles .venv node_modules __pycache__ *.egg-info
