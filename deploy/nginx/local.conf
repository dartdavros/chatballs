server {
  listen 80;
  server_name hub.localhost localhost;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Web Chat widget loader (served from the hub domain).
  location = /chat-widget.js {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
  }

  # Web Chat panel (iframe content) — Vite base /chat/.
  location /chat/ {
    proxy_pass http://web-chat:5175;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location / {
    proxy_pass http://internal-ui:5173;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
