services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: ${HUB_BACKEND_IMAGE:?HUB_BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env.production
    command: >
      sh -c "gunicorn hub_backend.asgi:application
      --worker-class uvicorn.workers.UvicornWorker
      --bind 0.0.0.0:8000
      --workers $${HUB_GUNICORN_WORKERS:-3}
      --timeout $${HUB_GUNICORN_TIMEOUT:-60}"
    volumes:
      # Файловые вложения знаний (ADR-HUB-0023).
      - ./data/media:/app/apps/backend/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os, urllib.request; req = urllib.request.Request('http://127.0.0.1:8000/api/v1/health/live/', headers={'Host': os.environ.get('HUB_HEALTHCHECK_HOST', 'hub.edevs.tech'), 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(req, timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    image: ${HUB_BACKEND_IMAGE:?HUB_BACKEND_IMAGE is required}
    restart: unless-stopped
    env_file:
      - .env.production
    command: python manage.py run_worker
    volumes:
      - ./data/media:/app/apps/backend/media
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: ${HUB_FRONTEND_IMAGE:?HUB_FRONTEND_IMAGE is required}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HUB_FRONTEND_HOST_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Coturn — отдельный медиа-relay сервис для TURN fallback (SPEC-HUB-0013 §11).
  # Host networking: relay использует широкий UDP-диапазон и реальный внешний IP,
  # публикуется напрямую и не проходит через HTTP reverse proxy. credentials
  # выдаёт backend по общему HUB_CALL_TURN_SECRET (static-auth-secret).
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${HUB_CALL_TURN_SECRET:?HUB_CALL_TURN_SECRET is required}
      - --realm=${HUB_CALL_TURN_REALM:?HUB_CALL_TURN_REALM is required}
      # Весь TURN живёт на выделенном публичном IP (отдельный порт/NIC), nginx — на
      # основном IP. Это освобождает 443 под TURN-over-TLS без конфликта с web.
      - --listening-ip=${HUB_TURN_LISTENING_IP:?HUB_TURN_LISTENING_IP is required}
      - --relay-ip=${HUB_TURN_EXTERNAL_IP:?HUB_TURN_EXTERNAL_IP is required}
      - --external-ip=${HUB_TURN_EXTERNAL_IP}
      - --listening-port=${HUB_TURN_LISTENING_PORT:-3478}
      # TURN-over-TLS на 443: проходит через VPN/строгие сети, где UDP и 3478 режут.
      - --tls-listening-port=${HUB_TURN_TLS_PORT:-443}
      - --cert=/etc/coturn/certs/fullchain.pem
      - --pkey=/etc/coturn/certs/privkey.pem
      - --min-port=${HUB_TURN_MIN_PORT:-49160}
      - --max-port=${HUB_TURN_MAX_PORT:-49200}
      # Запрет анонимного и внутрисетевого relay (SPEC §11: без пересечения с хостом).
      - --no-multicast-peers
      - --no-tcp-relay
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --no-tlsv1
      - --no-tlsv1_1
    volumes:
      # LE-сертификат TURN-хоста (turns:), скопированный под uid coturn (nobody)
      # renewal deploy-hook'ом. См. docs по развёртыванию TURN-over-TLS.
      - ./data/coturn-certs:/etc/coturn/certs:ro
    healthcheck:
      # Allocation smoke: STUN binding к собственному listener на выделенном IP.
      test: ["CMD", "turnutils_stunclient", "-p", "${HUB_TURN_LISTENING_PORT:-3478}", "${HUB_TURN_LISTENING_IP}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
